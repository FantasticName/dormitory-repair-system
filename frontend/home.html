<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍报修系统 - 首页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>宿舍报修系统</h1>
        <div class="nav">
            <button id="createOrderBtn" class="btn">创建报修单</button>
            <a href="dorm-update.html" class="btn">宿舍管理</a>
            <button id="logoutBtn" class="btn logout">退出登录</button>
        </div>
        
        <div class="order-list">
            <h2>我的报修单</h2>
            <div id="orderList" class="orders">
                <!-- 订单列表将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 创建订单模态框 -->
    <div id="createOrderModal" class="modal">
        <div class="modal-content">
            <h3>创建报修单</h3>
            <form id="createOrderForm">
                <div class="form-group">
                    <label for="deviceType">设备类型</label>
                    <input type="text" id="deviceType" name="deviceType" required>
                </div>
                <div class="form-group">
                    <label for="description">故障描述</label>
                    <textarea id="description" name="description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="image">上传图片</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelCreateBtn" class="btn cancel">取消</button>
                    <button type="submit" class="btn">提交</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 订单详情模态框 -->
    <div id="orderDetailModal" class="modal">
        <div class="modal-content">
            <h3>订单详情</h3>
            <div id="orderDetail" class="order-detail">
                <!-- 订单详情将通过JavaScript动态生成 -->
            </div>
            <button id="closeDetailBtn" class="btn">关闭</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
